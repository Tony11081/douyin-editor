<script>
window.EP=window.EP||{brand:'Etsy-Tony'};
window.TL=window.TL||{dur:21,cuts:[13.5],
  subs:[[0.3,3.4,['想拿Etsy星级卖家徽章','先过这几条线']],[3.8,6.8,['第一 买家的第一条消息','24小时内回复 要做到95%']],[7.5,10.3,['第二 按时发货','而且要有有效物流单号 也是95%']],
        [11.0,13.8,['第三 平均评分','不能低于4.8']],[14.3,16.8,['Etsy每个月考核一次','只看最近3个月']],[17.2,20.8,['评分有时靠运气','回复率全靠习惯']]]};
window.IDS=['rail','r1','r2','mo','badge','t1','t2','end','fol'];
// 横移轨道：每个指标停一会儿，再平移到下一个（[开始停, 开始移]）
const STOP=[[3.6,6.9],[7.6,10.4],[11.1,14.2]];
function railX(t){let x=0;for(let i=1;i<STOP.length;i++){const k=E.io(P(t,STOP[i-1][1],STOP[i][0]-STOP[i-1][1]));x=L(x,-1080*i,k);}return x;}
const MONTHS=['7月','8月','9月','10月','11月','12月'];
window.SEG=function(t){
  // 开场：镂空大字，实拍从字里透出来，最后镜头冲进字里
  const ko=$('ko');if(t<3.7){ko.style.display='block';const k=E.oq(P(t,.1,1.2));const fly=E.io(P(t,2.6,1.0));const s=L(.82,1,k)*L(1,14,fly);
    $('kot').setAttribute('transform',`translate(540 880) scale(${s.toFixed(4)}) translate(-540 -880)`);$('kot').setAttribute('opacity',1);
    $('kor').setAttribute('opacity',(1-E.io(P(t,3.0,.6))).toFixed(3));$('kol').setAttribute('opacity',(E.oc(P(t,.6,.6))*(1-fly)).toFixed(3));}else ko.style.display='none';
  // 指标轨道
  if(vis(t,3.5,14.4)){show('rail');const x=railX(t);const v=Math.abs(railX(t+1/30)-x)*30;
    T('rail',{x,op:E.oc(P(t,3.5,.4))*(1-E.io(P(t,13.9,.45))),bl:Math.min(16,v/180)});
    document.querySelectorAll('.pn').forEach((pn,i)=>{const lt=t-STOP[i][0];const k=E.io(P(lt,.2,1.3));
      const a=pn.querySelector('.arc');if(a){a.setAttribute('stroke-dashoffset',(1256.6*(1-.95*k)).toFixed(1));pn.querySelector('.num').textContent=Math.round(95*k);}
      ['.lb','.tt','.nt'].forEach((s,j)=>{const e=pn.querySelector(s);const kk=P(lt,-.25+j*.25,.5);e.style.opacity=E.oc(kk);e.style.transform=`translateY(${L(20,0,E.oq(kk))}px)`;});});
    const lt=t-STOP[2][0];const kr=E.io(P(lt,.2,1.3));$('rate').textContent=L(0,4.8,kr).toFixed(1);$('starsin').style.width=(500*.96*kr)+'px';}
  // 滚动三个月：高亮框沿月份滑动
  if(vis(t,14.2,17.2)){show('r1','r2','mo');const lt=t-14.2;fadeIn('r1',lt,.2,.6,20,12);fadeIn('r2',lt,.5,.6,16,10);
    document.querySelectorAll('#mo .m').forEach((m,i)=>{const k=P(lt,.4+i*.07,.4);m.style.opacity=E.oc(k);m.style.transform=`translateY(${L(30,0,E.oq(k))}px)`;});
    const step=Math.floor(Math.max(0,lt-1.2)/0.9);const fr=E.io(cl(((Math.max(0,lt-1.2))%0.9)/0.45));const idx=Math.min(3,step)+ (step<3?fr:0);
    $('win').style.left=(idx*164-8)+'px';$('win').style.opacity=E.oc(P(lt,.9,.3));fadeAway(['r1','r2','mo'],lt,2.6,.4);}
  // 见解 + 徽章
  if(vis(t,17.2,21)){show('badge','t1','t2','end','fol');const lt=t-17.2;const kb=P(lt,.1,.35);const land=E.oc(kb);
    T('badge',{s:L(2.2,1,land)*(kb>=1?1+.04*Math.exp(-(lt-.45)*7)*Math.sin((lt-.45)*26):1),r:L(-40,0,land)+2*Math.sin(t),op:kb>0?1:0});
    chars('t1',lt,.5,.06,.6,30,22);chars('t2',lt,1.1,.07,.6,30,22);fadeIn('end',lt,2.0,.6,10,6);const kf=P(lt,2.3,.5);T('fol',{s:L(.7,1,E.ob(kf)),op:E.oc(kf)});}
};
MONTHS.forEach((m,i)=>{const d=document.createElement('div');d.className='m';d.style.left=(i*164)+'px';d.textContent=m;$('mo').appendChild(d);});
$('starsin').innerHTML=Array(5).fill('<svg width="100" height="90" viewBox="-50 -45 100 90" style="display:inline-block"><path d="M0 -40 L11 -13 L40 -12 L18 7 L25 37 L0 21 L-25 37 L-18 7 L-40 -12 L-11 -13 Z" fill="#FFB547"/></svg>').join('');
$('stars').insertAdjacentHTML('afterbegin','<div style="position:absolute;left:0;top:0;white-space:nowrap;opacity:.22">'+Array(5).fill('<svg width="100" height="90" viewBox="-50 -45 100 90" style="display:inline-block"><path d="M0 -40 L11 -13 L40 -12 L18 7 L25 37 L0 21 L-25 37 L-18 7 L-40 -12 L-11 -13 Z" fill="#fff"/></svg>').join('')+'</div>');

</script>
