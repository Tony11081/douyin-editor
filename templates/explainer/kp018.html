<script>
window.EP=window.EP||{brand:'Etsy-Tony',url:'openaigrowth.com'};
window.TL=window.TL||{dur:33.8,cuts:[],
  subs:[[0.3,2.7,['Etsy店铺名开店以后','自己只能改5次']],[3.0,6.89,['开店前随便改','开店后改满5次','再改就要Etsy客服批准']],[7.19,11.11,['只改大小写','或者改回用过的旧名字','不算次数']],[11.41,15.87,['店名最多20个字符','不能有空格和标点','可以用大写字母分开单词']],[16.17,21.9,['改名后旧链接','会自动跳到新店名','店铺页上还会挂','45天的改名标记']],[22.2,27.31,['我们的看法：','店名就是你的店铺网址','开店前就定好','开店后别反复改']],[27.61,30.6,['开店前多想一天','比开店后改一次名划算']],[31.9,33.7,['关注我','每天一个Etsy知识点']]]};
window.IDS=['rail','r1','r2','mo','mx','badge','op','t1','t2','cal','t3','t4','end','fol'];
// 横移轨道：每个指标停一会儿，再平移到下一个（[开始停, 开始移]）
const STOP=[[3.0,6.7],[7.1,11.0],[11.4,15.9]];
const GOAL=[5,0,20],RMAX=[5,1,20];
function railX(t){let x=0;for(let i=1;i<STOP.length;i++){const k=E.io(P(t,STOP[i-1][1],STOP[i][0]-STOP[i-1][1]));x=L(x,-1080*i,k);}return x;}
const FMT=['旧店名','→','新店名'],FMT2=['改名标记 · 45 天'];
window.SEG=function(t){
  // 开场：镂空大字 5，实拍从字里透出来，最后镜头冲进字里
  const ko=$('ko');if(t<3.1){ko.style.display='block';const k=E.oq(P(t,.1,1.0));const fly=E.io(P(t,2.1,.9));const s=L(.82,1,k)*L(1,14,fly);
    $('kot').setAttribute('transform',`translate(540 920) scale(${s.toFixed(4)}) translate(-540 -920)`);$('kot').setAttribute('opacity',1);
    $('kor').setAttribute('opacity',(1-E.io(P(t,2.5,.5))).toFixed(3));$('kol').setAttribute('opacity',(E.oc(P(t,.4,.5))*(1-fly)).toFixed(3));$('kol2').setAttribute('opacity',(E.oc(P(t,.8,.5))*(1-fly)).toFixed(3));}else ko.style.display='none';
  // 指标轨道
  if(vis(t,2.8,16.2)){show('rail');const x=railX(t);const v=Math.abs(railX(t+1/30)-x)*30;
    T('rail',{x,op:E.oc(P(t,2.8,.4))*(1-E.io(P(t,15.75,.4))),bl:Math.min(16,v/180)});
    document.querySelectorAll('.pn').forEach((pn,i)=>{const lt=t-STOP[i][0];const k=E.io(P(lt,.2,1.3));
      const a=pn.querySelector('.arc');if(a){const g=GOAL[i];a.setAttribute('stroke-dashoffset',(1256.6*(1-k*g/RMAX[i])).toFixed(1));pn.querySelector('.num').textContent=Math.round(g*k);}
      ['.lb','.tt','.nt','.q'].forEach((s,j)=>{const e=pn.querySelector(s);if(!e)return;const kk=P(lt,-.25+j*.25+(j>=2?.6:0),.5);e.style.opacity=E.oc(kk);e.style.transform=`translateY(${L(20,0,E.oq(kk))}px)`;});});
    // 02 小写 → 大写
    const l2=t-STOP[1][0];[['sh1',.2],['sh3',.6],['sh2',.9]].forEach(([id,d])=>{const kk=P(l2,d,.45);const e=$(id);e.style.opacity=E.oc(kk);e.style.transform=`translateY(${L(40,0,E.ob(kk))}px)`;});}
  // 旧链接跳转 + 45 天标记
  if(vis(t,16.0,22.15)){show('r1','r2','mo','mx');const lt=t-16.0;fadeIn('r1',lt,.15,.5,20,12);
    document.querySelectorAll('#mo .m').forEach((m,i)=>{const k=P(lt,.8+i*.25,.4);m.style.opacity=E.oc(k);m.style.transform=`translateY(${L(30,0,E.oq(k))}px)`;});
    fadeIn('r2',lt,2.6,.5,16,10);
    document.querySelectorAll('#mx .m').forEach((m,i)=>{const k=P(lt,3.1+i*.12,.4);m.style.opacity=E.oc(k);m.style.transform=`translateY(${L(30,0,E.oq(k))}px)`;});
    fadeAway(['r1','r2','mo','mx'],lt,5.7,.4);}
  // 我们的看法 + 网址徽章
  if(vis(t,22.0,27.6)){show('badge','op','t1','t2','cal');const lt=t-22.0;const kb=P(lt,.1,.35);const land=E.oc(kb);
    T('badge',{s:L(2.2,1,land)*(kb>=1?1+.04*Math.exp(-(lt-.45)*7)*Math.sin((lt-.45)*26):1),r:L(-40,0,land)+2*Math.sin(t),op:kb>0?1:0});
    fadeIn('op',lt,.3,.4,10,6);chars('t1',lt,.5,.06,.6,30,22);chars('t2',lt,1.6,.07,.6,30,22);fadeIn('cal',lt,2.8,.5,14,8);fadeAway(['badge','op','t1','t2','cal'],lt,5.1,.4);}
  // 结尾：观点回扣 + 一行小字
  if(vis(t,27.5,33.9)){show('t3','t4','end','fol');const lt=t-27.5;chars('t3',lt,.15,.06,.6,30,22);chars('t4',lt,1.2,.06,.6,30,22);
    fadeIn('end',lt,3.9,.6,10,6);const kf=P(lt,4.4,.5);T('fol',{s:L(.7,1,E.ob(kf)),op:E.oc(kf)});}
};
FMT.forEach(f=>{const d=document.createElement('div');d.className='m';d.textContent=f;$('mo').appendChild(d);});FMT2.forEach(f=>{const d=document.createElement('div');d.className='m';d.textContent=f;$('mx').appendChild(d);});
['sh1','sh2','sh3'].forEach(id=>{$(id).style.transformBox='fill-box';});
kitBoot();
</script>
