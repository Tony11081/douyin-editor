<script>

window.IDS=['rail','r1','r2','mo','mx','badge','op','t1','t2','cal','t3','t4','end','fol'];
// 横移轨道：每个指标停一会儿，再平移到下一个（[开始停, 开始移]）
const STOP=[[3.8,6.6],[7.2,10.4],[10.9,14.0]];
const GOAL=[15,5];
function railX(t){let x=0;for(let i=1;i<STOP.length;i++){const k=E.io(P(t,STOP[i-1][1],STOP[i][0]-STOP[i-1][1]));x=L(x,-1080*i,k);}return x;}
const FMT=['横幅','布局','配色'],FMT2=['指定商品','店铺分区'];
window.SEG=function(t){
  // 开场：镂空大字 $10，实拍从字里透出来，最后镜头冲进字里
  const ko=$('ko');if(t<3.7){ko.style.display='block';const k=E.oq(P(t,.1,1.2));const fly=E.io(P(t,2.6,1.0));const s=L(.82,1,k)*L(1,14,fly);
    $('kot').setAttribute('transform',`translate(540 900) scale(${s.toFixed(4)}) translate(-540 -900)`);$('kot').setAttribute('opacity',1);
    $('kor').setAttribute('opacity',(1-E.io(P(t,3.0,.6))).toFixed(3));$('kol').setAttribute('opacity',(E.oc(P(t,.6,.6))*(1-fly)).toFixed(3));$('kol2').setAttribute('opacity',(E.oc(P(t,1.0,.6))*(1-fly)).toFixed(3));}else ko.style.display='none';
  // 指标轨道
  if(vis(t,3.5,14.3)){show('rail');const x=railX(t);const v=Math.abs(railX(t+1/30)-x)*30;
    T('rail',{x,op:E.oc(P(t,3.5,.4))*(1-E.io(P(t,13.85,.4))),bl:Math.min(16,v/180)});
    document.querySelectorAll('.pn').forEach((pn,i)=>{const lt=t-STOP[i][0];const k=E.io(P(lt,.2,1.3));
      const a=pn.querySelector('.arc');if(a){const g=GOAL[i];a.setAttribute('stroke-dashoffset',(1256.6*(1-k)).toFixed(1));pn.querySelector('.num').textContent=Math.round(g*k);}
      ['.lb','.tt','.nt','.q'].forEach((s,j)=>{const e=pn.querySelector(s);if(!e)return;const kk=P(lt,-.25+j*.25+(j==3?.5:0),.5);e.style.opacity=E.oc(kk);e.style.transform=`translateY(${L(20,0,E.oq(kk))}px)`;});});
    // 03 售罄 → 到货通知
    const l3=t-STOP[2][0];[['sh1',.2],['sh3',.6],['sh2',.9]].forEach(([id,d])=>{const kk=P(l3,d,.45);const e=$(id);e.style.opacity=E.oc(kk);e.style.transform=`translateY(${L(40,0,E.ob(kk))}px)`;});}
  // 店铺首页装修
  if(vis(t,14.1,17.95)){show('r1','r2','mo','mx');const lt=t-14.1;fadeIn('r1',lt,.15,.5,20,12);fadeIn('r2',lt,.45,.5,16,10);
    document.querySelectorAll('#mo .m').forEach((m,i)=>{const k=P(lt,1.0+i*.12,.4);m.style.opacity=E.oc(k);m.style.transform=`translateY(${L(30,0,E.oq(k))}px)`;});
    document.querySelectorAll('#mx .m').forEach((m,i)=>{const k=P(lt,1.6+i*.12,.4);m.style.opacity=E.oc(k);m.style.transform=`translateY(${L(30,0,E.oq(k))}px)`;});
    fadeAway(['r1','r2','mo','mx'],lt,3.45,.4);}
  // 我们的看法 + 账单徽章
  if(vis(t,17.8,21.75)){show('badge','op','t1','t2','cal');const lt=t-17.8;const kb=P(lt,.1,.35);const land=E.oc(kb);
    T('badge',{s:L(2.2,1,land)*(kb>=1?1+.04*Math.exp(-(lt-.45)*7)*Math.sin((lt-.45)*26):1),r:L(-40,0,land)+2*Math.sin(t),op:kb>0?1:0});
    fadeIn('op',lt,.3,.4,10,6);chars('t1',lt,.5,.06,.6,30,22);chars('t2',lt,1.1,.07,.6,30,22);fadeIn('cal',lt,1.9,.5,14,8);fadeAway(['badge','op','t1','t2','cal'],lt,3.5,.4);}
  // 结尾：观点回扣 + 一行小字
  if(vis(t,21.7,26.3)){show('t3','t4','end','fol');const lt=t-21.7;chars('t3',lt,.15,.06,.6,30,22);chars('t4',lt,.7,.06,.6,30,22);
    fadeIn('end',lt,1.6,.6,10,6);const kf=P(lt,2.0,.5);T('fol',{s:L(.7,1,E.ob(kf)),op:E.oc(kf)});}
};
FMT.forEach(f=>{const d=document.createElement('div');d.className='m';d.textContent=f;$('mo').appendChild(d);});FMT2.forEach(f=>{const d=document.createElement('div');d.className='m';d.textContent=f;$('mx').appendChild(d);});
['sh1','sh2','sh3'].forEach(id=>{$(id).style.transformBox='fill-box';});

</script>
