<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<title>64–78 · 创作者风格包</title>
<style>
@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}
@font-face{font-family:Playfair;src:url(fonts/Playfair.ttf)}

@font-face{font-family:Caveat;src:url(fonts/Caveat.ttf)}

.a{position:absolute}
.bgl{position:absolute;inset:0;z-index:0}

.foot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.cjk{font-family:"Noto Sans CJK SC",sans-serif;font-weight:900}
.serif{font-family:"Noto Serif CJK SC",serif}
</style></head>
<body><div id="stage"></div>
<script>
// ============ 共用引擎 ============
// ?tpl=代号 选模板；?hole=1 挖空素材窗（渲染透明 webm 叠在实拍上）；?cfg=JSON 覆盖文案（见 README）
const Q = new URLSearchParams(location.search);
const HOLE = Q.has('hole');
const TPL = Q.get('tpl') || 'bt';
const USER = Q.get('cfg') ? JSON.parse(Q.get('cfg')) : {};
if (HOLE) { document.documentElement.classList.add('hole'); document.body.classList.add('hole'); }
const S = document.getElementById('stage');
let W = 1080, H = 1920;
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const pr = (t, a, b) => cl((t - a) / (b - a));                 // 0→1 进度
const eo = k => 1 - Math.pow(1 - k, 3);                           // ease out
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const back = k => { const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const pop = (t, t0, d = .22) => back(pr(t, t0, t0 + d));          // 弹出 0→1（带回弹）
const rnd = s => { const x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function h(tag, css, html, parent) {
  const e = document.createElement(tag); e.className = 'a d';
  if (css) e.style.cssText += css; if (html != null) e.innerHTML = html; (parent || S).appendChild(e); return e;
}
function bg(css, parent) { const e = document.createElement('div'); e.className = 'bgl'; e.style.cssText += css; (parent || S).appendChild(e); return e; }
const set = (e, o) => { for (const k in o) e.style[k] = o[k]; };
// 高亮语法：[词] = 重点词
const mark = (s, open, close = '</span>') => s.replace(/\[([^\]]+)\]/g, (m, w) => open + w + close);
const C = (key, dflt) => (USER[key] !== undefined ? USER[key] : dflt);

// ---- 素材窗（挖洞） ----
// win: {slot, x,y,w,h, r?, circle?, rot?, t0, t1, zoom?, fx?, fy?}
let WINS = [];
function polyRR(w) {
  const pts = []; const { x, y } = w; const ww = w.w, hh = w.h;
  const r = w.circle ? Math.min(ww, hh) / 2 : Math.min(w.r || 0, ww / 2, hh / 2);
  const cs = [[x + ww - r, y + r, -90], [x + ww - r, y + hh - r, 0], [x + r, y + hh - r, 90], [x + r, y + r, 180]];
  for (const [cx, cy, a0] of cs) for (let i = 0; i <= 10; i++) {
    const a = (a0 + 9 * i) * Math.PI / 180; pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  const rot = (w.rot || 0) * Math.PI / 180, mx = x + ww / 2, my = y + hh / 2;
  return pts.map(([px, py]) => [mx + (px - mx) * Math.cos(rot) - (py - my) * Math.sin(rot), my + (px - mx) * Math.sin(rot) + (py - my) * Math.cos(rot)]);
}
const FOOT = {};
function footEl(w, i) {
  if (FOOT[i]) return FOOT[i];
  const e = document.createElement('div'); e.className = 'foot';
  const im = document.createElement('img'); im.src = (Q.get('bg') || 'sample') + '/foot_' + w.slot + '.jpg';
  im.onerror = () => { im.remove(); e.style.background = 'linear-gradient(135deg,#3a3f47,#1c1f24)'; };
  e.appendChild(im); S.appendChild(e); return FOOT[i] = e;
}
function applyHoles(t) {
  const act = WINS.filter(w => t >= w.t0 && t < w.t1);
  if (HOLE) {
    let d = `M0 0H${W}V${H}H0Z`;
    for (const w of act) d += 'M' + polyRR(w).map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L') + 'Z';
    const cp = act.length ? `path(evenodd,'${d}')` : 'none';
    document.querySelectorAll('.bgl').forEach(e => e.style.clipPath = cp);
  } else {
    WINS.forEach((w, i) => {
      const e = footEl(w, i), on = t >= w.t0 && t < w.t1;
      e.style.display = on ? 'block' : 'none'; if (!on) return;
      set(e, { left: w.x + 'px', top: w.y + 'px', width: w.w + 'px', height: w.h + 'px',
        borderRadius: w.circle ? '50%' : (w.r || 0) + 'px', transform: `rotate(${w.rot || 0}deg)` });
      const im = e.firstChild; if (im && im.style) { im.style.transform = `scale(${w.zoom || 1})`; im.style.objectPosition = `${(w.fx ?? .5) * 100}% ${(w.fy ?? .5) * 100}%`; }
    });
  }
}
// 胶片颗粒（canvas，每帧换噪点）
function grain(alpha = .08, z = 5) {
  const c = document.createElement('canvas'); c.width = 270; c.height = 480; c.className = 'a d';
  c.style.cssText = `inset:0;width:1080px;height:1920px;z-index:${z};opacity:${alpha};mix-blend-mode:overlay;image-rendering:pixelated`;
  S.appendChild(c); const g = c.getContext('2d'); const img = g.createImageData(270, 480);
  return t => { let s = Math.floor(t * 30) + 1; for (let i = 0; i < img.data.length; i += 4) { s = (s * 16807) % 2147483647; const v = s & 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; } g.putImageData(img, 0, 0); };
}
// 逐词字幕：segs=[{t0,t1,text}] text 用 [词] 标重点；style: 'pop' 逐词弹出 / 'fade'
function caption(el, segs, t, hiOpen, mode = 'pop') {
  const s = segs.find(s => t >= s.t0 && t < s.t1);
  if (!s) { el.style.opacity = 0; return; }
  el.style.opacity = 1;
  if (el._k !== s) { // 拆成 token
    el._k = s; const toks = []; s.text.replace(/\[([^\]]+)\]|([^\[\s]+|\s+)/g, (m, hi, plain) => { toks.push(hi ? { w: hi, hi: 1 } : { w: plain }); });
    el.innerHTML = toks.map(k => k.hi ? `${hiOpen}${k.w}</span>` : `<span>${k.w}</span>`).join('');
    el._n = toks.length;
  }
  const kids = el.children, n = kids.length, dur = Math.min(s.t1 - s.t0, 1.2);
  for (let i = 0; i < n; i++) {
    const k = mode === 'none' ? 1 : pop(t, s.t0 + dur * i / n * .8, .18);
    kids[i].style.display = 'inline-block'; kids[i].style.opacity = cl(k * 3);
    kids[i].style.transform = mode === 'pop' ? `translateY(${(1 - cl(k)) * 18}px) scale(${.7 + .3 * k})` : 'none';
  }
}

// ============ 15 个模板 ============
const T = {};

// ---------- 64 · 大字砸屏 Bold type ----------
T.bt = {
  no: 64, name: '大字砸屏 Bold Type', dur: 6.6,
  build() {
    const B = C('beats', [
      { t: 0, bg: '#F2651C', lines: [['不是你', '#111', 210, .15], ['不会选品', '#111', 210, .55], ['是没看数据。', '#FFF3E4', 190, 1.05]] },
      { t: 2.2, bg: '#111', lines: [['爆款', '#F2651C', 330, 2.3], ['从来不靠', '#FFF3E4', 170, 2.75], ['猜。', '#FFF3E4', 240, 3.1]] },
      { t: 4.3, bg: '#F3EADB', lines: [['IT\'S NOT', '#111', 200, 4.4, 'Anton'], ['LUCK.', '#F2651C', 330, 4.8, 'Anton'], ['是方法', '#111', 150, 5.3]] },
    ]);
    this.B = B; this.bgE = bg('');
    this.wrap = h('div', 'left:0;top:0;width:1080px;height:1920px');
    this.groups = B.map(b => {
      const g = h('div', 'left:90px;top:0;width:900px;height:1920px;display:flex;flex-direction:column;justify-content:center;gap:6px', '', this.wrap);
      g.style.position = 'absolute';
      g.items = b.lines.map(([txt, col, sz, t0, ff]) => {
        const e = document.createElement('div');
        e.style.cssText = `font-family:${ff || '"Noto Sans CJK SC"'};font-weight:900;font-size:${sz}px;line-height:1.02;color:${col};letter-spacing:${ff ? 4 : -6}px;transform-origin:20% 60%;white-space:nowrap`;
        e.textContent = txt; e.t0 = t0; g.appendChild(e); return e;
      }); return g;
    });
    this.tag = h('div', 'left:90px;top:250px;font:600 30px Inter;letter-spacing:6px;opacity:.75', C('tag', 'ETSY-TONY · 选品课 01'));
    this.flash = h('div', 'inset:0;background:#fff;z-index:9;opacity:0');
  },
  frame(t) {
    let bi = 0; this.B.forEach((b, i) => { if (t >= b.t) bi = i; });
    this.bgE.style.background = this.B[bi].bg;
    this.tag.style.color = bi === 1 ? '#FFF3E4' : '#111';
    let shake = 0;
    this.groups.forEach((g, i) => {
      g.style.display = i === bi ? 'flex' : 'none';
      g.items.forEach(e => {
        const k = pr(t, e.t0, e.t0 + .13); const on = t >= e.t0;
        e.style.opacity = on ? 1 : 0;
        e.style.transform = `scale(${lerp(1.6, 1, eo(k))}) rotate(${lerp(-4, 0, k)}deg)`;
        e.style.filter = k < 1 ? `blur(${(1 - k) * 8}px)` : 'none';
        const s = t - e.t0; if (i === bi && s >= 0.1 && s < .32) shake = Math.max(shake, (1 - (s - .1) / .22) * 14);
      });
    });
    this.wrap.style.transform = shake ? `translate(${(rnd(t * 99) - .5) * shake}px,${(rnd(t * 77) - .5) * shake}px)` : 'none';
    const sb = this.B.map(b => b.t).filter(x => x > 0).find(x => t >= x && t < x + .07);
    this.flash.style.opacity = sb ? .85 : 0;
  }
};

// ---------- 65 · 贴纸拼贴 Sticker collage ----------
const STK = {
  box: `<svg viewBox="0 0 200 200"><g stroke="#fff" stroke-width="22" stroke-linejoin="round" fill="#fff"><path d="M30 70 100 35 170 70 170 150 100 185 30 150Z"/></g><path d="M30 70 100 35 170 70 100 105Z" fill="#E2B477"/><path d="M30 70 100 105 100 185 30 150Z" fill="#C8955A"/><path d="M170 70 100 105 100 185 170 150Z" fill="#B07D45"/><path d="M62 54 132 88 132 112 120 106 120 92 50 60Z" fill="#F1D9A8" opacity=".9"/></svg>`,
  stocking: `<svg viewBox="0 0 200 200"><path d="M70 30h70v80l20 30c14 22-6 50-32 42l-60-18c-24-7-26-40-4-50l6-3z" fill="#fff" stroke="#fff" stroke-width="24" stroke-linejoin="round"/><path d="M70 30h70v80l20 30c14 22-6 50-32 42l-60-18c-24-7-26-40-4-50l6-3z" fill="#D7263D"/><path d="M80 60h50M80 85h52M76 108h58" stroke="#fff" stroke-width="7" opacity=".8"/><rect x="62" y="22" width="86" height="34" rx="14" fill="#fff" stroke="#e8e8e8" stroke-width="3"/></svg>`,
  coins: `<svg viewBox="0 0 200 200"><g stroke="#fff" stroke-width="22" fill="#fff"><ellipse cx="90" cy="150" rx="55" ry="20"/><rect x="35" y="80" width="110" height="70"/><ellipse cx="90" cy="80" rx="55" ry="20"/><rect x="110" y="40" width="70" height="100" rx="6"/></g><rect x="110" y="40" width="70" height="100" rx="6" fill="#3FA34D" transform="rotate(12 145 90)"/><circle cx="145" cy="90" r="16" fill="#9BD3A2" transform="rotate(12 145 90)"/>${[0, 1, 2, 3].map(i => `<ellipse cx="90" cy="${145 - i * 20}" rx="55" ry="20" fill="#E8A317" stroke="#B9790B" stroke-width="4"/>`).join('')}<ellipse cx="90" cy="80" rx="40" ry="12" fill="#F7C948"/></svg>`,
  star: `<svg viewBox="0 0 200 200"><path d="M100 18l24 52 57 6-43 39 12 56-50-29-50 29 12-56-43-39 57-6z" fill="#FFD23F" stroke="#fff" stroke-width="20" stroke-linejoin="round" paint-order="stroke"/></svg>`,
};
T.sk = {
  no: 65, name: '贴纸拼贴 Sticker Collage', dur: 6.6,
  build() {
    const L0 = bg(`background:#C9A27A;background-image:radial-gradient(rgba(255,255,255,.18) 1px,transparent 1.5px),radial-gradient(rgba(80,50,20,.12) 1px,transparent 1.5px);background-size:7px 7px,11px 11px`);
    // 背景日历纸片（在素材下面的东西都放进挖洞层 L0）
    h('div', `left:60px;top:250px;width:420px;height:460px;background:#F4EEE2;transform:rotate(-7deg);box-shadow:0 6px 18px rgba(0,0,0,.18);opacity:.9;font:700 46px/1.6 "Noto Sans CJK SC";color:#b9b1a3;padding:30px`, 'S M T W T F<br>2 3 4 5 6 7<br>9 10 11 12 13<br>16 17 18 19 20', L0);
    this.frameE = h('div', 'left:150px;top:420px;width:780px;height:920px;background:#FBF9F4;transform:rotate(-2deg);box-shadow:0 18px 40px rgba(0,0,0,.35)', '', L0);
    WINS.push({ slot: 'P', x: 178, y: 450, w: 724, h: 760, r: 2, rot: -2, t0: 0, t1: 99, fy: .38 });
    // 胶带
    [[120, 400, -38], [830, 395, 32], [860, 1270, -30]].forEach(([x, y, r]) => h('div', `left:${x}px;top:${y}px;width:190px;height:58px;background:rgba(236,224,196,.82);transform:rotate(${r}deg);box-shadow:0 2px 4px rgba(0,0,0,.12)`));
    // 剪报字
    const L = C('cut', [['爆', '#111', '#FFF'], ['单', '#fff', '#111'], ['了', '#111', '#FFD23F']]);
    this.cut = L.map(([ch, fg, bgc], i) => h('div', `left:${250 + i * 200}px;top:255px;width:190px;height:200px;background:${bgc};color:${fg};font:900 160px/200px "Noto Sans CJK SC";text-align:center;box-shadow:0 6px 14px rgba(0,0,0,.3);z-index:4`, ch));
    // 贴纸
    const SS = C('stickers', [['coins', 60, 1060, -12, 1.3], ['box', 720, 400, 10, 2.3], ['stocking', 640, 820, -8, 3.3], ['star', 30, 700, 8, 4.2]]);
    this.st = SS.map(([k, x, y, r, t0]) => { const e = h('div', `left:${x}px;top:${y}px;width:300px;height:300px;filter:drop-shadow(0 10px 10px rgba(0,0,0,.35));z-index:5`, STK[k]); e.r = r; e.t0 = t0; return e; });
    this.lab = h('div', 'left:230px;top:1270px;width:620px;padding:22px 30px;background:#FFFDF6;transform:rotate(1.5deg);box-shadow:0 8px 20px rgba(0,0,0,.25);text-align:center;font:900 64px/1.15 "Noto Sans CJK SC";color:#111;z-index:4');
    this.labIn = this.lab;
    this.sub = h('div', 'left:230px;top:1385px;width:620px;text-align:center;font:700 48px Caveat,Inter;color:#3a2a18;z-index:4', C('sub', "it's just really big."));
  },
  frame(t) {
    this.cut.forEach((e, i) => { const k = pop(t, .15 + i * .18, .25); e.style.opacity = t > .15 + i * .18 ? 1 : 0; e.style.transform = `rotate(${[-8, 5, -3][i]}deg) scale(${lerp(1.8, 1, cl(k))})`; });
    this.st.forEach(e => { const k = pop(t, e.t0, .3); e.style.opacity = t >= e.t0 ? 1 : 0; e.style.transform = `rotate(${e.r + (1 - cl(k)) * 25}deg) scale(${lerp(1.7, 1, k)})`; });
    caption(this.lab, C('caps', [{ t0: .6, t1: 99, text: '这单 真的 [很大]' }]), t, '<span style="background:#FFD23F;padding:0 8px">', 'pop');
    this.sub.style.opacity = pr(t, 1.4, 1.8);
  }
};

// ---------- 66 · 漫画演绎 Cartoon ----------
T.ct = {

    const L0 = bg(`background:#F6EAD6;background-image:radial-gradient(#e9c9a4 2.2px,transparent 2.6px);background-size:22px 22px`);

    // 速度线

    // 画中画人物（右上）
    WINS.push({ slot: 'P', x: 690, y: 275, w: 300, h: 360, r: 14, t0: 0, t1: 99, fy: .35 });
    h('div', 'left:680px;top:265px;width:320px;height:380px;border:10px solid #111;border-radius:22px;z-index:3;box-shadow:6px 6px 0 #111');
    // 禁止标志 + 问号
    this.ban = h('div', 'left:110px;top:520px;width:300px;height:300px;z-index:4', '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="#fff" stroke-width="20"/><circle cx="50" cy="50" r="40" fill="none" stroke="#E5202E" stroke-width="12"/><path d="M22 22 78 78" stroke="#fff" stroke-width="20"/><path d="M22 22 78 78" stroke="#E5202E" stroke-width="12"/></svg>');
    this.q = h('div', 'left:520px;top:640px;font:900 150px KuaiLe;color:#E5202E;-webkit-text-stroke:6px #111;z-index:4', '?!');
    this.word = h('div', 'left:120px;top:1020px;font:900 190px/1 Anton,"Noto Sans CJK SC";color:#E5202E;-webkit-text-stroke:8px #111;paint-order:stroke;text-shadow:10px 10px 0 #111;transform:rotate(-8deg);z-index:5;letter-spacing:4px', C('word', 'BLOCKED'));
    this.cap = h('div', 'left:150px;top:1290px;width:780px;text-align:center;z-index:6');
    this.capIn = h('div', 'position:relative;display:inline-block;background:#FFE14D;border:7px solid #111;padding:14px 30px;font:900 58px/1.2 "Noto Sans CJK SC";color:#111;box-shadow:8px 8px 0 #111;transform:rotate(-2deg)', '', this.cap);
  },
  frame(t) {

    this.panel.style.transform = `translate(${sh}px,${sh * .6}px)`;
    this.lines.style.opacity = t > 1.15 && t < 2.2 ? .9 * (1 - pr(t, 1.6, 2.2)) : 0;
    const kb = pop(t, 1.15, .3); this.ban.style.opacity = t > 1.15 ? 1 : 0; this.ban.style.transform = `scale(${kb}) rotate(${(1 - cl(kb)) * -90}deg)`;
    const kq = pop(t, 1.6, .25); this.q.style.opacity = t > 1.6 ? 1 : 0; this.q.style.transform = `scale(${kq}) rotate(${Math.sin(t * 9) * 6}deg)`;
    const kw = pop(t, 2.3, .28); this.word.style.opacity = t > 2.3 ? 1 : 0; this.word.style.transform = `rotate(-8deg) scale(${lerp(2.2, 1, cl(kw))})`;
    caption(this.capIn, C('caps', [{ t0: .3, t1: 2.3, text: '我刚上架的 [爆款]…' }, { t0: 2.3, t1: 99, text: '好吧，被平台 [下架] 了。' }]), t, '<span style="color:#E5202E">');
  }
};

// ---------- 67 · 杂志大片 Editorial ----------
T.ed = {
  no: 67, name: '杂志大片 Editorial', dur: 6.8,
  build() {
    WINS.push({ slot: 'W', x: 0, y: 0, w: 1080, h: 1920, t0: 0, t1: 99, fy: .3 });
    h('div', 'inset:0;background:linear-gradient(180deg,rgba(30,12,4,.55) 0%,rgba(30,12,4,0) 22%,rgba(30,12,4,0) 35%,rgba(25,10,4,.86) 60%,rgba(20,8,3,.95) 100%);z-index:2');
    h('div', 'inset:0;box-shadow:inset 0 0 260px rgba(0,0,0,.6);z-index:2');
    this.g = grain(.1, 3);
    this.mast = h('div', 'left:0;top:205px;width:1080px;text-align:center;font:400 150px/1 Playfair;letter-spacing:22px;color:#F5EDE3', C('mast', 'CRAFTED'));
    this.rule = h('div', 'left:110px;top:375px;width:860px;height:2px;background:#F5EDE3;transform-origin:50% 50%');

    this.kc = h('div', 'left:1010px;top:300px;width:380px;padding:26px 30px;border-radius:20px;background:#FFFDF7;color:#111;box-shadow:0 20px 40px rgba(0,0,0,.35);z-index:3', `<div style="font:700 24px Inter,'Noto Sans CJK SC';color:#C77700;letter-spacing:3px">${C('kicker', '要点 KEY POINT')}</div><div style="margin-top:8px;font:900 48px/1.3 'Noto Sans CJK SC'">${C('point', '先看 24 小时<br>真实销量')}</div>`);
    this.cap = h('div', 'left:80px;top:930px;width:1280px;text-align:center;font:900 60px "Noto Sans CJK SC";color:#fff;-webkit-text-stroke:7px rgba(0,0,0,.85);paint-order:stroke;z-index:4');
  },
  frame(t) {
    this.g(t);
    const ci = C('chapter', 2);
    this.chip.innerHTML = `<b style="background:#FFC23D;color:#111;border-radius:9px;padding:2px 12px;font:900 30px Inter">${String(ci + 1).padStart(2, '0')}/${String(this.CH.length).padStart(2, '0')}</b>${this.CH[ci]}`;
    this.chip.style.opacity = pr(t, .1, .5); this.bars.style.opacity = pr(t, .3, .7);
    this.barE.forEach((b, i) => { b.style.background = i < ci ? '#fff' : i === ci ? `linear-gradient(90deg,#FFC23D ${pr(t, 0, this.dur) * 100}%,rgba(255,255,255,.35) 0)` : 'rgba(255,255,255,.35)'; });
    const kn = eo(pr(t, .4, .9)) * (1 - eo(pr(t, 3.2, 3.6))); this.nameE.style.transform = `translateX(${(1 - kn) * -620}px)`;
    const kk = pop(t, 3.8, .35) * (t > 6.8 ? 1 - pr(t, 6.8, 7.1) : 1); this.kc.style.opacity = cl(kk * 2); this.kc.style.transform = `translateX(${(1 - cl(kk)) * 120}px) rotate(${(1 - cl(kk)) * 4}deg)`;
    caption(this.cap, C('caps', [{ t0: .3, t1: 3.6, text: '所以我就想结合我自己的一些经历' }, { t0: 3.6, t1: 99, text: '选品第一步，先看 [真实销量]' }]), t, '<span style="color:#FFC23D">', 'none');
  }
};

// ============ 启动 ============
const CUR = T[TPL]; if (!CUR) throw new Error('没有这个模板：' + TPL);
if (CUR.size) { [W, H] = CUR.size; for (const e of [document.documentElement, document.body]) { e.style.width = W + 'px'; e.style.height = H + 'px'; } }
window.SIZE = [W, H];
CUR.build();
// ?label=1：样片合集用，顶部小标签写模板编号和名字
if (Q.has('label')) h('div', `left:0;top:${H > W ? 120 : 14}px;width:${W}px;text-align:center;z-index:98`, `<span style="display:inline-block;background:rgba(0,0,0,.72);color:#fff;font:800 30px Inter,'Noto Sans CJK SC';padding:8px 22px;border-radius:30px;border:2px solid rgba(255,255,255,.5)">${CUR.no} 号 · ${CUR.name}</span>`);
// ?guide=1：叠一层抖音界面遮挡区（只用于检查，不要出片）
// 竖版 1080×1920：顶部 0–200 搜索/标签栏；底部 1460 以下是账号名、文案、评论框；右侧 930 以右、860–1600 是头像/点赞/评论/收藏/分享
if (Q.has('guide') && H > W) {
  const z = (css, txt) => h('div', css + ';z-index:99;background:rgba(255,0,60,.28);outline:3px dashed #ff2d55;font:700 30px "Noto Sans CJK SC";color:#fff;display:flex;align-items:center;justify-content:center;text-align:center', txt);
  z('left:0;top:0;width:1080px;height:200px', '顶部搜索栏');
  z('left:0;top:1460px;width:1080px;height:460px', '账号名 · 文案 · 评论框（会盖住）');
  z('left:930px;top:860px;width:150px;height:740px', '按钮列');
}
window.DUR = C('dur', CUR.dur);
window.render = t => { CUR.frame(t); applyHoles(t); };
// 给合成脚本用：素材窗（时间段 + 位置 + 推近倍数）
window.META = () => {
  const out = []; const step = 1 / 30; let prev = null;
  for (let t = 0; t < DUR; t += step) {
    CUR.frame(t);
    const act = WINS.filter(w => t >= w.t0 && t < w.t1).map(w => JSON.stringify({ slot: w.slot, x: w.x, y: w.y, w: w.w, h: w.h, zoom: w.zoom || 1, fx: w.fx ?? .5, fy: w.fy ?? .5 }));
    const key = act.join('|');
    if (key !== prev) { out.push({ t: +t.toFixed(3), wins: act.map(a => JSON.parse(a)) }); prev = key; }
  }
  return { tpl: TPL, no: CUR.no, name: CUR.name, dur: DUR, segments: out };
};
render(0);
