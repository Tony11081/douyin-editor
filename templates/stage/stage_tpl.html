<!doctype html>
<html><head><meta charset="utf-8">
<!-- 42 号模板「演讲舞台」：前景透明层，window.render(t) 逐帧驱动 -->
<style>
:root{--red:#E62B1E;--sans:"Noto Sans CJK SC",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
body{font-family:var(--sans);color:#fff;-webkit-font-smoothing:antialiased;position:relative}
.ab{position:absolute;will-change:transform,opacity}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 75% 60% at 50% 55%,rgba(0,0,0,0) 40%,rgba(0,0,0,.62) 100%),linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,0) 35%),linear-gradient(rgba(0,0,0,0) 54%,rgba(0,0,0,.55) 63%,rgba(0,0,0,.6) 75%,rgba(0,0,0,0) 88%)}
#ev{left:64px;top:100px;font:700 28px/1 "Jost";letter-spacing:.24em;display:flex;align-items:center;gap:14px;white-space:nowrap}
#ev i{width:22px;height:22px;background:var(--red);display:block;border-radius:50%}
#ev span{color:#bbb;margin-left:10px;letter-spacing:.12em;font-family:var(--sans);font-weight:500}
.q{left:64px;right:64px;top:180px;font:700 74px/1.3 var(--sans)}
.q .mk{display:block;font:700 160px/0.7 "Playfair Display",serif;color:var(--red);height:70px}
.q .lb{display:block;font:700 30px/1 "Jost";letter-spacing:.3em;color:var(--red);margin-bottom:22px}
.q small{display:block;font:500 34px/1.55 var(--sans);color:#d2d2d2;margin-top:18px;letter-spacing:.04em}
.q .ln{display:block;width:0;height:6px;background:var(--red);margin-top:22px}
.q.term{font:800 110px/1.05 "Jost",var(--sans)}
.q.term.cn{font:900 92px/1.15 var(--sans)}
.q.term small{font-size:42px;color:#e2e2e2}
#spk{left:64px;top:1150px;text-shadow:0 2px 12px rgba(0,0,0,.8)}
#spk b{display:block;font:800 64px/1 "Jost";white-space:nowrap}
#spk b em{font:500 40px var(--sans);font-style:normal;color:#ddd;margin-left:14px}
#spk i{display:block;height:6px;width:80px;background:var(--red);margin:16px 0;transform-origin:left}
#spk span{font:500 32px/1 var(--sans);color:#ddd}
#cap{left:60px;right:60px;top:1350px;text-align:center;font:700 58px/1.35 var(--sans);text-shadow:0 2px 14px rgba(0,0,0,.75),0 0 3px rgba(0,0,0,.6)}
#cap b{color:#FF5A4E}
</style></head>
<body>
<div id="vig"></div>
<div id="ev" class="ab"><i></i>ETSY-TONY TALKS · 05<span id="evc"></span></div>
<div id="blocks"></div>
<div id="spk" class="ab"><b id="sn"></b><i id="sl"></i><span id="ss"></span></div>
<div id="cap" class="ab"></div>
<script src="cfg05s.js"></script>
<script>
const $=id=>document.getElementById(id);const C=window.CFG;
const P=(t,a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a)));
const oE=k=>1-Math.pow(1-k,3), iO=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
function S(el,o,x=0,y=0,s=1){el.style.opacity=o.toFixed(3);el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${s.toFixed(4)})`}
$('sn').innerHTML=C.name.n+'<em>'+C.name.cn+'</em>';$('ss').textContent=C.name.sub;
// 顶部大字块：开场金句、章节、名词卡、结尾卡，同一时间只出一个
C.blocks.forEach((k,i)=>{const d=document.createElement('div');d.className='ab q'+(k.term?' term':'')+(k.cn?' cn':'');d.id='bk'+i;
  d.innerHTML=(k.quote?'<span class="mk">“</span>':'')+(k.lb?`<span class="lb">${k.lb}</span>`:'')+k.h+(k.sub?`<small>${k.sub}</small>`:'')+'<span class="ln"></span>';$('blocks').appendChild(d)});
const esc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function capHTML(txt){const mark=new Array(txt.length).fill(0);
  for(const k of C.keys){let p=txt.indexOf(k);while(p>=0){for(let j=p;j<p+k.length;j++)mark[j]=1;p=txt.indexOf(k,p+k.length)}}
  let h='',on=0;[...txt].forEach((ch,j)=>{if(mark[j]&&!on){h+='<b>';on=1}if(!mark[j]&&on){h+='</b>';on=0}h+=esc(ch)});if(on)h+='</b>';return h}
let capI=-2;
function render(t){
  let ci=0;C.chapters.forEach((c,i)=>{if(t>=c[0])ci=i});
  const cc=C.chapters[ci];const ev=$('evc');const tx=cc[1]+' '+cc[2];if(ev.textContent!==tx)ev.textContent=tx;
  ev.style.opacity=P(t-cc[0],0.2,0.6).toFixed(3);S($('ev'),1);
  C.blocks.forEach((k,i)=>{const el=$('bk'+i);
    if(t<k.a-0.01||t>k.b){el.style.opacity=0;return}
    const first=k.a<=0.001;const kin=first?1:oE(P(t,k.a,k.a+0.5)),out=iO(P(t,k.b-0.35,k.b));
    S(el,kin*(1-out),0,first?0:28*(1-kin)-16*out);
    el.querySelector('.ln').style.width=(oE(P(t,k.a+0.2,k.a+0.8))*120).toFixed(1)+'px'});
  const n=C.name;const nk=oE(P(t,n.a,n.a+0.45)),no=iO(P(t,n.b-0.35,n.b));
  S($('spk'),(t<n.a||t>n.b)?0:nk*(1-no),-30*(1-nk),0);
  $('sl').style.transform=`scaleX(${oE(P(t,n.a+0.15,n.a+0.6)).toFixed(3)})`;
  const i=C.cues.findIndex(c=>t>=c[0]&&t<c[1]);
  if(i<0){$('cap').style.opacity=0;return}
  if(i!==capI){$('cap').innerHTML=capHTML(C.cues[i][2]);capI=i}
  const a=C.cues[i][0];const k=i===0?1:oE(P(t,a,a+0.14));S($('cap'),k,0,8*(1-k));
}
window.render=render;render(0);
</script>
</body></html>
