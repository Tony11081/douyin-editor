<!doctype html>
<!-- 口碑墙 · 风格 A「倾斜滚墙」：整面卡片墙倾斜滚动、镜头拉远、标题逐字升起 → 主角卡从墙里弹出 → 结尾按钮。render(t) 画一帧。 -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
#stage{position:absolute;inset:0;perspective:1800px;overflow:hidden;
  background:radial-gradient(ellipse 80% 45% at 50% 40%,rgba(200,255,0,.10),transparent 70%),radial-gradient(circle at 1px 1px,rgba(255,255,255,.07) 1.2px,transparent 0) 0 0/36px 36px,var(--bg)}
#world{position:absolute;left:50%;top:50%;width:2000px;height:3600px;margin:-1800px 0 0 -1000px;transform-style:preserve-3d;display:flex;gap:28px;justify-content:center}
.col{width:440px;display:flex;flex-direction:column;gap:28px}
#veil{position:absolute;inset:0;pointer-events:none}
#title{position:absolute;left:0;right:0;top:300px;display:flex;flex-direction:column;gap:26px}
#hero{position:absolute;left:50%;top:930px;width:820px}
</style></head><body>
<div id="stage"><div id="world"></div></div>
<div id="veil"></div>
<div id="title"><div class="eyebrow" id="eb"></div><h1 class="headline" id="hl"></h1></div>
<div id="hero" class="hero"></div>
<div class="cta" id="cta"><div class="url" id="url"></div><small id="sub"></small></div>
<div class="wm" id="wm" hidden></div>
<script src="common.js"></script>
<script>
const S=window.SPEC,{cardHTML,E,esc}=TW,$=id=>document.getElementById(id);
$("eb").textContent=S.eyebrow||"";$("hl").innerHTML=(S.title||[]).map(w=>`<span>${esc(w)}</span>`).join("");
$("url").textContent=S.cta||"";$("sub").textContent=S.sub||"";
if(S.watermark){$("wm").textContent=S.watermark;$("wm").hidden=false}
const cards=S.cards,world=$("world"),cols=[];
for(let c=0;c<4;c++){const col=document.createElement("div");col.className="col";let h="";
  for(let i=0;i<14;i++)h+=cardHTML(cards[(i*5+c*3)%cards.length],{glow:(i+c)%7===3});
  col.innerHTML=h;world.appendChild(col);cols.push(col)}
$("hero").innerHTML=cardHTML(S.hero||cards[0]);
const hc=$("hero").firstElementChild,words=[...$("hl").children],title=$("title"),cta=$("cta"),veil=$("veil"),stage=$("stage");
const D=S.duration||8; // 时间点按 8 秒排，时长不同时整体按比例伸缩
window.render=function(T){
  const t=T*8/D;
  const pull=E.inOut(t/3.2);
  world.style.transform=`translateZ(${-200-700*pull}px) rotateX(${34-12*pull}deg) rotateZ(${-12+4*pull}deg) scale(${1.35-.25*pull})`;
  cols.forEach((c,i)=>{const dir=i%2?1:-1;c.style.transform=`translateY(${(i%2?-900:-200)+dir*(i%2?110:140)*t}px)`});
  $("eb").style.opacity=E.cl((t-.3)/.4);
  words.forEach((w,i)=>{const p=E.out((t-.45-i*.14)/.6);w.style.transform=`translateY(${(1-p)*90}px)`;w.style.opacity=p});
  const o=E.out((t-4)/.5);title.style.opacity=1-o;title.style.transform=`translateY(${-60*o}px) scale(${1-.06*o})`;
  const hp=E.back((t-4.2)/.9);
  $("hero").style.opacity=E.cl((t-4.2)/.25);
  $("hero").style.transform=`translate(-50%,-50%) translate(${(1-hp)*-260}px,${(1-hp)*380}px) perspective(1400px) rotateX(${(1-hp)*28}deg) rotateY(${(1-hp)*-18}deg) scale(${.35+.65*hp})`;
  const d=E.cl((t-4.2)/.8);
  veil.style.background=`radial-gradient(ellipse 60% 50% at 50% 50%,rgba(7,7,10,${.1+.5*d}),rgba(7,7,10,.8))`;
  stage.style.filter=`blur(${6*d}px) brightness(${1-.35*d})`;
  const sw=E.bell((t-5.2)/1.1);
  hc.style.boxShadow=`0 0 0 2px rgba(200,255,0,${.25+.5*sw}),0 0 ${80+60*sw}px rgba(200,255,0,${.18+.2*sw}),0 40px 120px rgba(0,0,0,.6)`;
  hc.querySelectorAll(".stars svg").forEach((s,i)=>{s.style.transform=`scale(${E.back((t-4.9-i*.09)/.45)})`});
  const cp=E.back((t-6.1)/.7);cta.style.opacity=E.cl((t-6.1)/.3);cta.style.transform=`translateY(${(1-cp)*80}px)`;
};
render(0);
</script></body></html>
