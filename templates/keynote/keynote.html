<!doctype html>
<!-- 47 号「发布会」v3 —— 一根线的故事。
     视觉规则：全片黑白灰，唯一的颜色是那根青柠绣线（开场走针、名字缎面绣、下划线、结尾收针）。
     画面在 canvas 里画（产品、绣线、光、颗粒），字在 DOM 里（遮罩升起、靠左排版）。
     场景：thread 开场 · statement 大字 · stitch 微距绣名字→拉远 · montage 卡点换产品 · stat 数字 · family 全家福 · end 结尾。
     时长都是 0.5 秒（120 BPM 一拍）的倍数，方便卡音乐。render(t) 画一帧。 -->
<html><head><meta charset="utf-8">
<style>
:root{--w:#f5f5f7;--g:#86868b;--g2:#4a4a4f;--lime:#c8ff00;--sans:"Noto Sans CJK SC",sans-serif;--mono:"JetBrains Mono","DejaVu Sans Mono",monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:var(--sans);color:var(--w)}
canvas{position:absolute;inset:0}
.sc{position:absolute;inset:0;display:none}
.L{position:absolute;left:96px;right:96px}
.lab{font:500 26px/1 var(--mono);letter-spacing:.22em;color:var(--g)}
.lab i{font-style:normal;color:var(--lime)}
.st{font-weight:500;font-size:112px;line-height:1.16;letter-spacing:-.025em}
.st .ln{display:block;overflow:hidden;padding-bottom:.06em}
.st .ln>span{display:inline-block}
.st .dim{color:var(--g)}
.big{font-weight:500;letter-spacing:-.06em;line-height:.9}
.who{font:500 30px/1.5 var(--mono);color:var(--g)}
.chip{display:inline-block;margin-left:14px;font:600 22px/1 var(--mono);color:var(--lime);border:1.5px solid currentColor;border-radius:7px;padding:7px 10px;letter-spacing:.06em;vertical-align:middle}
.wm{position:absolute;right:36px;top:44px;font:500 22px/1 var(--mono);color:rgba(255,255,255,.4);border:1.5px dashed rgba(255,255,255,.22);padding:10px 14px;border-radius:10px;z-index:5}
.cap{font:500 24px/1 var(--mono);letter-spacing:.24em;color:var(--g);text-align:center}
</style></head><body>
<canvas id="cv" width="1080" height="1920"></canvas>
<div id="root"></div>
<div class="wm" id="wm" hidden></div>
<script>
const S=window.SPEC,$=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),lerp=(a,b,p)=>a+(b-a)*p;
const out=x=>1-Math.pow(1-cl(x),3),out5=x=>1-Math.pow(1-cl(x),5),in3=x=>Math.pow(cl(x),3),
  io=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},io5=x=>{x=cl(x);return x<.5?16*x**5:1-Math.pow(-2*x+2,5)/2};
if(S.watermark){$("wm").textContent=S.watermark;$("wm").hidden=false}
const LIME="#c8ff00",LIME_D="#7a9a00",LIME_L="#ecffa3";

/* ---------- 素材 ---------- */
const imgs={};
function img(src){if(!imgs[src]){const i=new Image();i.src=src;imgs[src]=i}return imgs[src]}
window.__imgs=imgs;
var scenesPre=(S.scenes||[]).forEach(sc=>{if(sc.image)img(sc.image);(sc.items||[]).forEach(it=>it.image&&img(it.image))});
const glyphs=S.glyphs||{};            // render.py 预先算好的草书字形：{名字:{d,w,top,bottom}}（字号 100）
const P2={};const path2=n=>P2[n]||(P2[n]=new Path2D(glyphs[n].d));

/* ---------- 画布 ---------- */
const cv=$("cv"),g=cv.getContext("2d"),off=document.createElement("canvas");off.width=1080;off.height=1920;const o=off.getContext("2d");
let seed=3;const rnd=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);
const grain=[0,1,2,3].map(()=>{const c=document.createElement("canvas");c.width=540;c.height=960;const x=c.getContext("2d"),d=x.createImageData(540,960);
  for(let i=0;i<d.data.length;i+=4){const v=rnd()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);return c});
const weave=(()=>{const c=document.createElement("canvas");c.width=c.height=64;const x=c.getContext("2d");
  for(let yy=0;yy<64;yy+=2)for(let xx=0;xx<64;xx+=2){x.fillStyle=`rgba(0,0,0,${.03+.05*rnd()})`;x.beginPath();x.ellipse(xx+1,yy+1,.55,.85,((xx/2+yy/2)%2?.5:-.5),0,6.28);x.fill()}return c})();
let weavePat=null;

// 镜头：世界坐标 → 屏幕。cam={x,y,s} 表示屏幕中心看着世界里的 (x,y)，放大 s 倍
const camT=(c,ctx=g)=>ctx.setTransform(c.s,0,0,c.s,540-c.x*c.s,960-c.y*c.s);

// 产品：放在世界坐标 (cx,cy)，高 h；带投影和地面倒影
function product(src,cx,cy,h,{cam,alpha=1,blur=0,reflect=true,bright=1}={}){
  const im=img(src);if(!im.complete||!im.naturalWidth)return null;
  const w=h*im.naturalWidth/im.naturalHeight,x=cx-w/2,y=cy-h/2;
  camT(cam);g.save();g.globalAlpha=alpha;
  if(reflect){g.save();g.globalAlpha=alpha*.10;g.translate(0,(y+h)*2+16);g.scale(1,-1);g.filter=`blur(${2+blur}px) brightness(${bright*.8})`;g.drawImage(im,x,y,w,h);g.restore();
    g.save();camT(cam);const fl=g.createLinearGradient(0,y+h+8,0,y+h+h*.5);fl.addColorStop(0,"rgba(0,0,0,0)");fl.addColorStop(1,"rgba(0,0,0,1)");g.globalAlpha=1;g.fillStyle=fl;g.fillRect(x-200,y+h+8,w+400,h*.5);g.restore()}
  g.filter=`blur(${blur}px) brightness(${bright}) drop-shadow(0 ${h*.04}px ${h*.05}px rgba(0,0,0,.65))`;
  g.drawImage(im,x,y,w,h);g.restore();
  return {x,y,w,h};
}
// 织物纹理（微距时看得见）
function fabric(box,cam,alpha){if(!box||alpha<=0)return;weavePat=weavePat||g.createPattern(weave,"repeat");camT(cam);g.save();g.globalAlpha=alpha;g.globalCompositeOperation="multiply";
  g.fillStyle=weavePat;g.beginPath();g.rect(box.x,box.y,box.w,box.h);g.clip();g.fillRect(box.x,box.y,box.w,box.h);g.restore()}

/* 缎面绣：把名字的字形当作区域，里面密排斜向针脚，从左往右一针针走；带针、带高光、带凸起的投影
   name：字；cx,cy：世界坐标里名字的中心；W：名字的世界宽度；p：0~1 进度 */
function satin(name,cx,cy,W,p,cam,t,needle=true){
  const gl=glyphs[name];if(!gl||p<=0)return;
  const k=W/gl.w,H=(gl.bottom-gl.top);
  o.setTransform(1,0,0,1,0,0);o.clearRect(0,0,1080,1920);
  const M=(ctx)=>{camT(cam,ctx);ctx.translate(cx-W/2,cy-(gl.top+H/2)*k);ctx.scale(k,k)};
  M(o);o.save();o.clip(path2(name));
  const sp=1.9/k,sl=Math.tan(28*Math.PI/180)*H,front=-sl+p*(gl.w+sl*2);
  o.lineCap="butt";
  let i=0;for(let x=-sl;x<front;x+=sp,i++){const j=Math.sin(i*12.9898)*43758.5453%1,jit=(j-.5)*sp*.22,x2=x+sl+jit;
    o.lineWidth=sp*1.04;o.strokeStyle=j>.85?"#a8dc00":"#bdf200";o.beginPath();o.moveTo(x,gl.top-2);o.lineTo(x2,gl.bottom+2);o.stroke();
    o.lineWidth=sp*.42;o.strokeStyle="rgba(222,255,120,.7)";o.beginPath();o.moveTo(x-sp*.12,gl.top-2);o.lineTo(x2-sp*.12,gl.bottom+2);o.stroke();
    o.lineWidth=sp*.12;o.strokeStyle="rgba(250,255,220,.7)";o.beginPath();o.moveTo(x-sp*.18,gl.top-2);o.lineTo(x2-sp*.18,gl.bottom+2);o.stroke();
    o.lineWidth=sp*.2;o.strokeStyle="rgba(60,80,0,.6)";o.beginPath();o.moveTo(x+sp*.44,gl.top-2);o.lineTo(x2+sp*.44,gl.bottom+2);o.stroke()}
  // 丝线光泽：斜向一道亮带
  o.globalCompositeOperation="source-atop";
  const sh=o.createLinearGradient(0,gl.top,gl.w*.6,gl.bottom);sh.addColorStop(0,"rgba(255,255,255,.35)");sh.addColorStop(.45,"rgba(255,255,255,0)");sh.addColorStop(.7,"rgba(0,0,0,.18)");sh.addColorStop(1,"rgba(255,255,255,.12)");
  o.fillStyle=sh;o.fillRect(-20,gl.top-20,gl.w+40,H+40);
  // 边缘压暗一圈，绣线显得鼓起来
  o.filter=`blur(${1.2*cam.s}px)`;o.strokeStyle="rgba(40,60,0,.42)";o.lineWidth=5/k;o.stroke(path2(name));o.filter="none";o.restore();
  // 边缘一圈走针
  o.save();o.beginPath();o.rect(-sl,gl.top-10,front+sl,H+20);o.clip();o.globalCompositeOperation="source-over";o.strokeStyle="rgba(110,140,0,.75)";o.lineWidth=.9;o.stroke(path2(name));o.restore();
  // 贴回主画布，投影让绣线凸起来
  g.save();g.setTransform(1,0,0,1,0,0);g.shadowColor="rgba(0,0,0,.45)";g.shadowBlur=6*cam.s/2;g.shadowOffsetY=2*cam.s/2;g.drawImage(off,0,0);g.restore();
  // 针
  if(needle&&p<1){
    camT(cam);g.save();g.translate(cx-W/2,cy-(gl.top+H/2)*k);g.scale(k,k);
    const fx=Math.min(gl.w,front),fy=gl.top+H*(Math.floor(t*30)%2?.18:.82);
    const gr=g.createRadialGradient(fx,fy,0,fx,fy,22);gr.addColorStop(0,"rgba(236,255,163,.9)");gr.addColorStop(1,"rgba(200,255,0,0)");g.fillStyle=gr;g.beginPath();g.arc(fx,fy,22,0,6.28);g.fill();
    const nl=g.createLinearGradient(fx-3,0,fx+3,0);nl.addColorStop(0,"#6b6b70");nl.addColorStop(.5,"#fff");nl.addColorStop(1,"#8a8a90");
    g.strokeStyle=nl;g.lineWidth=4.2;g.lineCap="round";g.beginPath();g.moveTo(fx+10,fy-140);g.lineTo(fx,fy);g.stroke();
    g.strokeStyle=LIME;g.lineWidth=1.4;g.beginPath();g.moveTo(fx+9,fy-128);g.quadraticCurveTo(fx+60,fy-300,fx+20,fy-900);g.stroke();g.restore();
  }
}

/* 走针线：沿一条曲线一段段出现的虚线针脚（开场、下划线、结尾都用它）。pts 为屏幕坐标折线 */
function runStitch(pts,p,{w=6,dash=26,gap=14,needle=true,t=0,glow=1}={}){
  if(p<=0)return;let L=0;const seg=[];for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(d);L+=d}
  const end=L*p;g.save();g.setTransform(1,0,0,1,0,0);g.lineCap="round";
  const at=s=>{let a=0;for(let i=0;i<seg.length;i++){if(a+seg[i]>=s){const q=(s-a)/seg[i];return[lerp(pts[i][0],pts[i+1][0],q),lerp(pts[i][1],pts[i+1][1],q)]}a+=seg[i]}return pts[pts.length-1]};
  g.shadowColor=`rgba(200,255,0,${.45*glow})`;g.shadowBlur=14;
  for(let s=0;s<end;s+=dash+gap){const a=at(s),b=at(Math.min(s+dash,end));g.strokeStyle=LIME;g.lineWidth=w;g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();
    g.shadowBlur=0;g.strokeStyle=LIME_L;g.lineWidth=w*.32;g.beginPath();g.moveTo(a[0],a[1]-w*.18);g.lineTo(b[0],b[1]-w*.18);g.stroke();g.shadowBlur=14}
  if(needle&&p<1){const f=at(end),f2=at(Math.max(0,end-30)),ang=Math.atan2(f[1]-f2[1],f[0]-f2[0]);g.shadowBlur=0;
    const gr=g.createRadialGradient(f[0],f[1],0,f[0],f[1],40);gr.addColorStop(0,"rgba(236,255,163,.8)");gr.addColorStop(1,"rgba(200,255,0,0)");g.fillStyle=gr;g.beginPath();g.arc(f[0],f[1],40,0,6.28);g.fill();
    g.translate(f[0],f[1]);g.rotate(ang);const nl=g.createLinearGradient(0,-4,0,4);nl.addColorStop(0,"#6b6b70");nl.addColorStop(.5,"#fff");nl.addColorStop(1,"#8a8a90");
    g.strokeStyle=nl;g.lineWidth=5;g.beginPath();g.moveTo(6,0);g.lineTo(96,0);g.stroke();g.fillStyle="#000";g.beginPath();g.ellipse(84,0,6,1.6,0,0,6.28);g.fill()}
  g.restore();
}
const curve=(f,n=80)=>Array.from({length:n+1},(_,i)=>f(i/n));

/* 光：暗背景上一块柔和的主光 + 暗角 */
function light(x,y,r,a,warm=0){g.save();g.setTransform(1,0,0,1,0,0);const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(${255},${255-warm*12},${255-warm*30},${a})`);gr.addColorStop(1,"rgba(255,255,255,0)");g.fillStyle=gr;g.fillRect(0,0,1080,1920);g.restore()}
function finish(fi,vig=.75){g.save();g.setTransform(1,0,0,1,0,0);const v=g.createRadialGradient(540,900,500,540,960,1300);v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,`rgba(0,0,0,${vig})`);g.fillStyle=v;g.fillRect(0,0,1080,1920);
  g.globalAlpha=.055;g.globalCompositeOperation="overlay";g.drawImage(grain[fi%4],0,0,1080,1920);g.restore()}

/* ---------- 场景 ---------- */
const DUR={thread:3.5,statement:2.5,stitch:5,montage:3,stat:2.5,family:3,end:3.5};
const scenes=[{type:"thread"}].concat(S.scenes||[]);if(!scenes.some(s=>s.type==="end"))scenes.push({type:"end"});
let acc=0;scenes.forEach(s=>{s.t0=acc;s.d=s.duration||(s.type==="montage"?Math.max(2,(s.items||[]).length*.75):DUR[s.type]||2.5);acc+=s.d});window.TOTAL=acc;
const root=$("root");
const lines=(arr,hl)=>arr.map((l,i)=>`<span class="ln"><span class="${i>0&&!hl?"":""}">${esc(l).replace(/\{(.+?)\}/g,'<em class="hl" style="font-style:normal">$1</em>')}</span></span>`).join("");
scenes.forEach(s=>{const e=document.createElement("div");e.className="sc";s.el=e;root.appendChild(e);let h="";
  if(s.type==="thread")h=`<div class="L lab" style="top:760px" id="t-lab">${esc(S.eyebrow||"")}</div><div class="L st" style="top:820px;font-size:150px;letter-spacing:-.045em"><span class="ln"><span>${esc(S.brand||"Shopwright")}</span></span></div>`;
  if(s.type==="statement")h=`${s.label?`<div class="L lab" style="top:${s.top||640}px">${esc(s.label)}</div>`:""}<div class="L st" style="top:${(s.top||640)+60}px">${(s.lines||[]).map((l,i)=>`<span class="ln"><span class="${i>=(s.bright??99)?"dim":""}">${esc(l).replace(/\{(.+?)\}/g,'<em style="font-style:normal" class="hl">$1</em>')}</span></span>`).join("")}</div>${s.who?`<div class="L who" style="top:${(s.top||640)+80+(s.lines||[]).length*130}px">— ${esc(s.who)}${s.sample?'<span class="chip">示例</span>':""}</div>`:""}`;
  if(s.type==="stitch")h=`<div class="L st" style="top:180px;font-size:96px"><span class="ln"><span>${esc(s.title||"")}</span></span></div><div class="L lab" style="top:310px">${esc(s.caption||"")}</div>`;
  if(s.type==="montage")h=`<div class="L st" style="top:250px;font-size:96px">${(s.lines||[]).map((l,i)=>`<span class="ln"><span class="${i>0?"dim":""}">${esc(l)}</span></span>`).join("")}</div><div class="cap" style="position:absolute;left:0;right:0;top:1560px" id="m-cap"></div>`;
  if(s.type==="stat")h=`<div class="L lab" style="top:560px">${esc(s.label||"")}</div><div class="L" style="top:600px;display:flex;align-items:flex-end;gap:30px"><span class="ln" style="overflow:hidden;display:block"><span class="big" style="display:inline-block;font-size:560px">${esc(s.value)}</span></span><span class="ln" style="overflow:hidden;display:block;padding-bottom:70px"><span class="st" style="display:inline-block;font-size:96px;line-height:1.1">${esc(s.unit||"")}</span></span></div><div class="L st" style="top:1150px;font-size:72px"><span class="ln"><span class="dim">${esc(s.note||"")}</span></span></div>${s.sample?'<div class="L" style="top:1260px"><span class="chip" style="margin:0">示例 · 待核对</span></div>':""}`;
  if(s.type==="family")h=`<div class="L st" style="top:220px;font-size:96px">${(s.lines||[]).map((l,i)=>`<span class="ln"><span class="${i>0?"dim":""}">${esc(l)}</span></span>`).join("")}</div>`+(s.items||[]).map((it,i)=>`<div class="cap fcap" style="position:absolute;width:540px;left:${(i%2)*540}px;top:${i<2?1010:1480}px">${esc(it.label||"")}</div>`).join("");
  if(s.type==="end")h=`<div class="L lab" style="top:780px">${esc(S.brand||"Shopwright")}</div><div class="L st" style="top:830px;font-size:100px;font-family:var(--sans);letter-spacing:-.03em"><span class="ln"><span>${esc(s.cta||S.cta||"")}</span></span></div><div class="L st" style="top:1060px;font-size:44px;letter-spacing:0"><span class="ln"><span class="dim">${esc(s.sub||S.sub||"")}</span></span></div>`;
  e.innerHTML=h});
document.querySelectorAll(".hl").forEach(x=>x.style.color="inherit");

// 行遮罩升起
const riseLines=(e,lt,start,gap=.12,dur=.7,sel=".ln>span")=>[...e.querySelectorAll(sel)].forEach((x,i)=>{const p=out5((lt-start-i*gap)/dur);x.style.transform=`translateY(${(1-p)*105}%)`});
const exitP=(s,lt,d=.3)=>in3((lt-(s.d-d))/d);
// 某个 DOM 元素在屏幕上的下边框（下划线跟着字走）
const under=el=>{const r=el.getBoundingClientRect();return[r.left,r.right,r.bottom]};

window.render=function(t){
  t=Math.min(t,acc-1e-4);const fi=Math.floor(t*30);
  g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.filter="none";g.fillStyle="#000";g.fillRect(0,0,1080,1920);
  let vig=.75;
  scenes.forEach(s=>{
    const lt=t-s.t0,on=lt>=0&&lt<s.d;s.el.style.display=on?"block":"none";if(!on)return;const e=s.el,x=exitP(s,lt);
    e.style.opacity=1-x;
    if(s.type==="thread"){
      light(540,980,900,.06*out(lt/1.5));
      // 一针一针从左边走进来，划出一道弧，停在字标下面
      const pts=curve(q=>[lerp(-60,990,q),1080+Math.sin(q*Math.PI*1.15+.4)*-110+q*40]);
      runStitch(pts,io((lt-.1)/2.0),{t,glow:1});
      riseLines(e,lt,1.25,.1,.8);
      const lab=e.querySelector(".lab");lab.style.opacity=out((lt-1.7)/.5);
      g.save();g.setTransform(1,0,0,1,0,0);g.globalAlpha=in3((lt-3.0)/.5);g.fillStyle="#000";g.fillRect(0,0,1080,1920);g.restore();
    }
    if(s.type==="statement"){
      light(300,900,1000,.05);
      riseLines(e,lt,.05,.14,.7);
      const hl=e.querySelector(".hl");if(hl){const[a,b,y]=under(hl);runStitch(curve(q=>[lerp(a-6,b+6,q),y+6+Math.sin(q*9)*2],30),io((lt-.65)/.7),{w:6,dash:20,gap:10,t})}
      const w=e.querySelector(".who");if(w)w.style.opacity=out((lt-.8)/.5);
      const lb=e.querySelector(".lab");if(lb)lb.style.opacity=out(lt/.4);
    }
    if(s.type==="stitch"){
      // 微距（镜头 3.2 倍对着胸口）→ 绣完 → 拉远看到整件
      const H=s.height||1120,cx=540,cy=930,at=s.at||[.5,.4],nw=s.width||.42;
      const im=img(s.image);const ar=im.naturalWidth?im.naturalWidth/im.naturalHeight:1,W0=H*ar;
      const sx=cx-W0/2+at[0]*W0,sy=cy-H/2+at[1]*H;
      const pull=io5((lt-2.7)/1.6),sp=out((lt-.35)/2.3),nW=nw*W0;
      const fx=sx+lerp(-.32,.32,io(cl((lt-.2)/2.6)))*nW;
      const cam={x:lerp(fx,cx,pull),y:lerp(sy,cy,pull),s:lerp(3.1,1,pull)*(1+.012*lt)};
      light(lerp(380,540,pull),lerp(700,760,pull),lerp(1300,950,pull),.10+.04*pull);
      const box=product(s.image,cx,cy,H,{cam,blur:lerp(2.5,0,pull)+in3(1-lt/.5)*20,bright:lerp(.92,1,pull)*cl(lt/.5)});
      fabric(box,cam,(1-pull)*.9);
      satin(s.name,sx,sy,nW,sp,cam,t,true);
