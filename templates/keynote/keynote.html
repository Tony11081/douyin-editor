<!doctype html>
<!-- 47 号「发布会」：苹果发布会式的竖屏产品片。spec.scenes 一页一页排：
     intro 品牌开场 · product 单品亮相（可现场绣名字）· lineup 产品转台 · stat 大数字 · quote 原话 · onemore · end 结尾。
     render(t) 画一帧；每页自己管进场和出场，默认时长见 DUR。 -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Pacifico";src:url("assets/Pacifico-Regular.ttf")}
:root{--text:#f5f5f7;--muted:#9a9aa2;--lime:#c8ff00;
  --sans:"Noto Sans CJK SC","Noto Sans SC",sans-serif;--mono:"JetBrains Mono","DejaVu Sans Mono",monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:var(--sans);color:var(--text)}
#fx{position:absolute;inset:0}
.sc{position:absolute;inset:0;display:none;overflow:hidden}
.abs{position:absolute;left:0;right:0;text-align:center}
.eye{font:600 28px/1 var(--mono);letter-spacing:.34em;color:var(--lime)}
.ch{display:inline-block;will-change:transform}
.metal .ch{background:linear-gradient(180deg,#fff 25%,#9b9ba3 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.08em}
.limeg .ch{background:linear-gradient(180deg,#f3ffc2 0%,var(--lime) 45%,#7d9e00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.08em}
.clip{overflow:hidden;display:inline-block;padding:0 .04em}
/* intro */
.flare{position:absolute;left:0;right:0;top:880px;height:4px;transform-origin:50% 50%}
.flare::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#fff 48%,#fff 52%,transparent);filter:blur(1px)}
.flare::after{content:"";position:absolute;left:0;right:0;top:-60px;height:124px;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(200,255,0,.55),transparent 70%)}
.brand{font-size:156px;font-weight:900;letter-spacing:-.05em;line-height:1;white-space:nowrap}
/* product */
.prod{position:absolute;left:50%;top:210px;width:880px;height:880px;margin-left:-440px;perspective:2000px}
.prod .wrap{position:absolute;inset:0;transform-style:preserve-3d}
.prod img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 50px 60px rgba(0,0,0,.75));-webkit-box-reflect:below -10px linear-gradient(transparent 70%,rgba(255,255,255,.14))}
.prod svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.stitch{font-family:"Pacifico",cursive;fill:var(--lime);stroke:var(--lime);stroke-width:3;paint-order:stroke}
.stitch2{font-family:"Pacifico",cursive;fill:none;stroke:#5b7300;stroke-width:1.6;stroke-dasharray:7 5}
.ttl{font-size:200px;font-weight:900;letter-spacing:-.05em;line-height:1.02}
.sub{font-size:46px;font-weight:500;color:var(--muted);letter-spacing:.01em}
/* lineup */
.ring{position:absolute;left:540px;top:640px;width:0;height:0;perspective:2400px}
.ring .rot{position:absolute;transform-style:preserve-3d}
.ring .it{position:absolute;left:0;top:0}
.ring img{position:absolute;width:460px;height:460px;margin:-230px 0 0 -230px;object-fit:contain;filter:drop-shadow(0 40px 40px rgba(0,0,0,.7))}
.ring .lbl{position:absolute;width:400px;margin-left:-200px;top:300px;text-align:center;font:600 30px/1 var(--mono);letter-spacing:.2em;color:var(--lime)}
.floor{position:absolute;left:90px;right:90px;top:880px;height:180px;border-radius:50%;background:radial-gradient(ellipse at 50% 50%,rgba(200,255,0,.28),rgba(200,255,0,.05) 45%,transparent 70%)}
/* stat */
.num{font:700 560px/1 var(--mono);letter-spacing:-.08em;font-variant-numeric:tabular-nums;white-space:nowrap}
.ghost{position:absolute;left:0;right:0;font:700 560px/1 var(--mono);letter-spacing:-.08em;color:transparent;-webkit-text-stroke:2px rgba(200,255,0,.5);white-space:nowrap}
.unit{font-size:150px;font-weight:900;letter-spacing:-.03em;line-height:1}
.lab{font-size:66px;font-weight:900;letter-spacing:-.02em}
.note{font-size:36px;color:var(--muted)}
.tagx{display:inline-block;font:600 24px/1 var(--mono);color:var(--lime);border:2px solid currentColor;border-radius:8px;padding:9px 14px;letter-spacing:.08em}
/* quote */
.bigq{position:absolute;left:0;right:0;top:120px;text-align:center;font:900 1100px/1 Georgia,serif;color:rgba(200,255,0,.07)}
.qt{font-size:92px;font-weight:900;line-height:1.32;letter-spacing:-.03em;padding:0 70px;text-wrap:balance}
.qt b{color:var(--lime);text-shadow:0 0 50px rgba(200,255,0,.35)}
.qw{font:500 34px/1.4 var(--mono);color:var(--muted)}
/* onemore */
.om{font-size:84px;font-weight:500;font-style:italic;color:#e4e4e7;letter-spacing:-.01em}
.burst{position:absolute;left:540px;top:820px;border-radius:50%;transform:translate(-50%,-50%);border:5px solid var(--lime);box-shadow:0 0 60px var(--lime),inset 0 0 60px rgba(200,255,0,.45)}
/* end */
.row{position:absolute;left:0;right:0;top:360px;height:420px}
.row img{position:absolute;top:0;height:380px;width:380px;object-fit:contain;filter:drop-shadow(0 30px 30px rgba(0,0,0,.7));-webkit-box-reflect:below 0 linear-gradient(transparent 72%,rgba(255,255,255,.12))}
.pill{display:inline-block;font:700 62px/1 var(--mono);color:#0a0a0a;background:var(--lime);padding:32px 56px;border-radius:999px;box-shadow:0 0 90px rgba(200,255,0,.55)}
.wm{position:absolute;right:36px;top:44px;font:500 22px/1 var(--mono);color:rgba(255,255,255,.45);border:1.5px dashed rgba(255,255,255,.25);padding:10px 14px;border-radius:10px}
</style></head><body>
<canvas id="fx" width="1080" height="1920"></canvas>
<div id="root"></div>
<div class="wm" id="wm" hidden></div>
<script>
const S=window.SPEC,$=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const rich=s=>esc(s).replace(/\[\[(.+?)\]\]/g,"<b>$1</b>");
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),lerp=(a,b,p)=>a+(b-a)*p;
const out=x=>1-Math.pow(1-cl(x),3),out5=x=>1-Math.pow(1-cl(x),5),in3=x=>Math.pow(cl(x),3),
  io=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},bell=x=>Math.sin(Math.PI*cl(x)),
  back=(x,c=1.6)=>{x=cl(x);return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
if(S.watermark){$("wm").textContent=S.watermark;$("wm").hidden=false}
const chars=(t,cls="")=>`<span class="${cls}">${[...String(t)].map(c=>`<span class="clip"><span class="ch">${c===" "?"&nbsp;":esc(c)}</span></span>`).join("")}</span>`;
const lines=(t,cls)=>String(t).split("\n").map(l=>`<div>${chars(l,cls)}</div>`).join("");

const DUR={intro:2.8,product:3.8,lineup:3.8,stat:2.4,quote:3.0,onemore:3.4,end:3.0};
const scenes=[{type:"intro"}].concat(S.scenes||[]);
if(!scenes.some(s=>s.type==="end"))scenes.push({type:"end"});
let acc=0;scenes.forEach(s=>{s.t0=acc;s.d=s.duration||DUR[s.type]||2.5;acc+=s.d});
window.TOTAL=acc;
const root=$("root");

scenes.forEach(s=>{
  const el=document.createElement("div");el.className="sc "+s.type;s.el=el;root.appendChild(el);
  let h="";
  if(s.type==="intro")h=`<div class="flare"></div><div class="abs" style="top:780px"><div class="brand metal">${chars(S.brand||"Shopwright")}</div></div><div class="abs eye" style="top:1040px">${esc(S.eyebrow||"")}</div>`;
  if(s.type==="product"){
    const st=s.stitch?`<svg viewBox="0 0 880 880"><text class="stitch" x="${(s.stitchAt||[50,40])[0]*8.8}" y="${(s.stitchAt||[50,40])[1]*8.8}" text-anchor="middle" font-size="${s.stitchSize||120}" transform="rotate(-6 ${(s.stitchAt||[50,40])[0]*8.8} ${(s.stitchAt||[50,40])[1]*8.8})">${esc(s.stitch)}</text><text class="stitch2" x="${(s.stitchAt||[50,40])[0]*8.8}" y="${(s.stitchAt||[50,40])[1]*8.8}" text-anchor="middle" font-size="${s.stitchSize||120}" transform="rotate(-6 ${(s.stitchAt||[50,40])[0]*8.8} ${(s.stitchAt||[50,40])[1]*8.8})">${esc(s.stitch)}</text></svg>`:"";
    h=`<div class="prod"><div class="wrap"><img src="${esc(s.image)}">${st}</div></div>
      <div class="abs eye" style="top:1110px">${esc(s.eyebrow||"")}</div>
      <div class="abs ttl ${s.lime?"limeg":"metal"}" style="top:1170px">${lines(s.title||"")}</div>
      <div class="abs sub" style="top:1400px">${esc(s.sub||"")}</div>`;
  }
  if(s.type==="lineup"){
    h=`<div class="floor"></div><div class="ring"><div class="rot">${(s.items||[]).map(it=>`<div class="it"><img src="${esc(it.image)}"><div class="lbl">${esc(it.label||"")}</div></div>`).join("")}</div></div>
      <div class="abs ttl metal" style="top:1150px;font-size:170px">${lines(s.title||"")}</div>
      <div class="abs sub" style="top:1360px">${esc(s.sub||"")}</div>`;
  }
  if(s.type==="stat")h=`<div class="abs eye" style="top:330px">${esc(s.eyebrow||"")}</div>
      <div class="ghost" style="top:430px;text-align:center"><span class="gv">0</span></div>
      <div class="abs" style="top:430px"><span class="num limeg"><span class="ch v">0</span></span></div>
      <div class="abs unit metal" style="top:1010px">${chars(s.unit||"")}</div>
      <div class="abs lab" style="top:1200px">${esc(s.label||"")}</div>
      <div class="abs note" style="top:1300px">${esc(s.note||"")}${s.sample?' <span class="tagx">示例</span>':""}</div>`;
  if(s.type==="quote")h=`<div class="bigq">“</div><div class="abs qt" style="top:560px">${rich(s.text)}</div>
      <div class="abs qw" style="top:1200px">— ${esc([s.who,s.meta].filter(Boolean).join(" · "))}${s.sample?' <span class="tagx">示例</span>':""}</div>`;
  if(s.type==="onemore")h=`<div class="burst"></div><div class="abs om" style="top:770px">${esc(s.text||"One more thing…")}</div>
      <div class="two">${s.image?`<div class="prod" style="top:160px"><div class="wrap"><img src="${esc(s.image)}"></div></div>`:""}
      <div class="abs eye" style="top:${s.image?1110:700}px">${esc(s.eyebrow||"")}</div>
      <div class="abs ttl limeg" style="top:${s.image?1170:770}px">${lines(s.title||"")}</div>
      <div class="abs sub" style="top:${s.image?1400:1010}px">${esc(s.sub||"")}</div></div>`;
  if(s.type==="end"){
    const imgs=s.images||[];
    h=`<div class="row">${imgs.map((src,i)=>`<img src="${esc(src)}" style="left:${540-190+(i-(imgs.length-1)/2)*250}px">`).join("")}</div>
      <div class="abs brand metal" style="top:${imgs.length?900:700}px;font-size:150px">${chars(S.brand||"Shopwright")}</div>
      <div class="abs" style="top:${imgs.length?1110:930}px"><span class="pill">${esc(s.cta||S.cta||"")}</span></div>
      <div class="abs sub" style="top:${imgs.length?1270:1090}px;font-size:38px">${esc(s.sub||S.sub||"")}</div>`;
  }
  el.innerHTML=h;
});

// 舞台光：黑底、顶部聚光、产品背后的青柠光晕、缓慢漂移的两团光
const fx=$("fx"),g=fx.getContext("2d");let seed=9;const rnd=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);
const dust=Array.from({length:160},()=>({x:rnd()*1080,y:rnd()*1920,s:.5+rnd()*2,v:6+rnd()*22,p:rnd()*6.28}));
function blob(x,y,r,c,a){if(a<=0)return;const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(${c},${a})`);gr.addColorStop(1,`rgba(${c},0)`);g.fillStyle=gr;g.fillRect(0,0,1080,1920)}
function stage(t,L){
  g.fillStyle="#000";g.fillRect(0,0,1080,1920);
  blob(540+180*Math.sin(t*.35),300+80*Math.cos(t*.27),1100,"255,255,255",.10*L.spot);
  blob(540,L.cy,L.r,"200,255,0",L.glow*.34);
  blob(540+260*Math.sin(t*.22+2),1500,900,"160,200,0",.10*L.spot);
  // 顶部光束
  if(L.spot>0){g.save();g.globalCompositeOperation="lighter";
    const beam=g.createLinearGradient(0,0,0,1500);beam.addColorStop(0,`rgba(255,255,255,${.16*L.spot})`);beam.addColorStop(1,"rgba(255,255,255,0)");
    g.fillStyle=beam;g.beginPath();g.moveTo(420,-20);g.lineTo(660,-20);g.lineTo(1000,1500);g.lineTo(80,1500);g.closePath();g.fill();
    for(const d of dust){const y=(d.y-t*d.v+7680)%1920,x=d.x+Math.sin(t*.7+d.p)*14,w=Math.max(0,1-Math.abs(x-540)/(120+y*.3));
      if(w>0){g.fillStyle=`rgba(255,255,255,${.55*w*L.spot})`;g.beginPath();g.arc(x,y,d.s,0,6.28);g.fill()}}
    g.restore()}
  if(L.flash>0){g.fillStyle=`rgba(240,255,200,${L.flash})`;g.fillRect(0,0,1080,1920)}
}
const rise=(root,sel,lt,start,gap,dur=.6,dist=110)=>[...root.querySelectorAll(sel)].forEach((c,j)=>{const p=out5((lt-start-j*gap)/dur);c.style.transform=`translateY(${(1-p)*dist}%)`});
function exitT(s,lt,d=.4){return in3((lt-(s.d-d))/d)}

window.render=function(t){
  t=Math.min(t,acc-1e-3);
  const L={spot:0,glow:0,cy:700,r:700,flash:0};
  scenes.forEach((s,idx)=>{
    const lt=t-s.t0,on=lt>=0&&lt<s.d;s.el.style.display=on?"block":"none";if(!on)return;
    const e=s.el,x=exitT(s,lt);
    if(s.type==="intro"){
      const fw=io(lt/.6);const fl=e.querySelector(".flare");fl.style.transform=`scaleX(${fw})`;fl.style.opacity=1-cl((lt-1.0)/.4);
      rise(e,".brand .ch",lt,.45,.05,.7);
      const b=e.querySelector(".brand");b.style.letterSpacing=`${lerp(.03,-.045,out(lt/1.6))}em`;
      const z=in3((lt-2.2)/.6);b.style.transform=`scale(${1+5*z})`;b.style.opacity=1-cl((lt-2.45)/.3);b.style.filter=`blur(${z*10}px)`;
      const ey=e.querySelector(".eye");ey.style.opacity=out((lt-1.1)/.5)*(1-cl((lt-2.1)/.2));ey.style.letterSpacing=`${lerp(.6,.34,out((lt-1.1)/.8))}em`;
      L.spot=out((lt-.9)/1.2);L.glow=.5*bell(lt/2.2);L.cy=880;L.r=800;L.flash=.85*bell((lt-2.5)/.4);
    }
    if(s.type==="product"||(s.type==="onemore"&&s.image&&lt>1.4)){
      const local=s.type==="product"?lt:lt-1.4;
      const w=e.querySelector(".prod .wrap"),p=out5(local/1.2);
      w.style.transform=`translateY(${(1-p)*-180-x*120+10*Math.sin(local*1.6)}px) rotateY(${(1-p)*-35+7*Math.sin(local*.9)}deg) rotateX(${(1-p)*12}deg) scale(${lerp(1.3,1,p)*(1+.03*local)})`;
      w.style.filter=`blur(${(1-p)*18+x*14}px)`;w.style.opacity=cl(local/.25)*(1-x);
      const st=e.querySelector(".stitch"),st2=e.querySelector(".stitch2");
      if(st){const d=out((local-.9)/1.3);st.style.strokeDasharray=2400;st.style.strokeDashoffset=2400*(1-d);st.style.fillOpacity=cl((local-1.9)/.4);st2.style.opacity=cl((local-1.9)/.4);
        st.style.filter=`drop-shadow(0 0 ${6+14*bell((local-1.8)/.8)}px rgba(200,255,0,.8))`}
    }
    if(s.type==="product"){
      rise(e,".ttl .ch",lt,.55,.06,.7);
      e.querySelector(".ttl").style.opacity=1-x;e.querySelector(".ttl").style.transform=`translateY(${-x*60}px)`;
      const ey=e.querySelector(".eye");ey.style.opacity=out((lt-.4)/.4)*(1-x);
      const sb=e.querySelector(".sub");sb.style.opacity=out((lt-1.2)/.5)*(1-x);sb.style.transform=`translateY(${(1-out((lt-1.2)/.5))*30}px)`;
      L.spot=1;L.glow=out(lt/1)*(1-.5*x);L.cy=620;L.r=820;L.flash=.5*bell((lt-s.d+.15)/.3);
    }
    if(s.type==="lineup"){
      const items=[...e.querySelectorAll(".it")],n=items.length||1,R=320,p=out5(lt/1.1);
      const rot=lerp(-140,0,p)+(-42*lt);
      items.forEach((it,i)=>{const a=(i/n*360+rot)*Math.PI/180,z=Math.cos(a),xx=Math.sin(a)*R*1.15;
        const sc=lerp(.55,1.05,(z+1)/2)*lerp(.6,1,p);
        it.style.transform=`translate(${xx}px,${(1-z)*-40}px) scale(${sc})`;it.style.zIndex=Math.round(z*100+100);
        it.style.opacity=(lerp(.25,1,(z+1)/2))*cl(lt/.3)*(1-x);it.style.filter=`brightness(${lerp(.35,1,(z+1)/2)}) blur(${(1-(z+1)/2)*3}px)`;
        it.querySelector(".lbl").style.opacity=cl((z-.85)/.15)});
      rise(e,".ttl .ch",lt,.6,.05,.7);e.querySelector(".ttl").style.opacity=1-x;
      const sb=e.querySelector(".sub");sb.style.opacity=out((lt-1.2)/.5)*(1-x);
      e.querySelector(".floor").style.opacity=cl(lt/.6)*(1-x);
      L.spot=1;L.glow=.8*out(lt/.8);L.cy=700;L.r=760;L.flash=.4*bell((lt-s.d+.15)/.3);
    }
    if(s.type==="stat"){
      const v=Number(s.value)||0,dec=String(s.value).includes(".")?String(s.value).split(".")[1].length:0,p=out5((lt-.05)/1.1);
      const txt=(v*p).toFixed(dec);e.querySelector(".v").textContent=txt;e.querySelector(".gv").textContent=v.toFixed(dec);
      const n=e.querySelector(".num");n.style.display="inline-block";n.style.transform=`scale(${lerp(1.35,1,p)*(1+.02*lt)}) translateY(${-x*80}px)`;n.style.filter=`blur(${(1-p)*16+x*16}px)`;n.style.opacity=cl(lt/.15)*(1-x);
      const gh=e.querySelector(".ghost"),gp=out((lt-.9)/.9);gh.style.transform=`scale(${1+.45*gp})`;gh.style.opacity=(1-gp)*cl((lt-.9)/.05);
      rise(e,".unit .ch",lt,.55,.05,.55);
      [".lab",".note",".unit"].forEach((q,i)=>{const o=e.querySelector(q);o.style.opacity=(q===".unit"?1:out((lt-.8-i*.12)/.45))*(1-x)});
      e.querySelector(".eye").style.opacity=out(lt/.4)*(1-x);
      L.spot=1;L.glow=.9*out(lt/.6);L.cy=700;L.r=700;L.flash=.35*bell((lt-s.d+.12)/.25);
    }
    if(s.type==="quote"){
      const bq=e.querySelector(".bigq");bq.style.transform=`scale(${lerp(1.3,1,out5(lt/1.2))}) translateY(${-lt*20}px)`;bq.style.opacity=cl(lt/.4)*(1-x);
      const q=e.querySelector(".qt"),p=out5((lt-.2)/.9);q.style.opacity=p*(1-x);q.style.transform=`translateY(${(1-p)*80-x*60}px)`;q.style.filter=`blur(${(1-p)*12+x*10}px)`;
      e.querySelector(".qw").style.opacity=out((lt-1.0)/.5)*(1-x);
      L.spot=.8;L.glow=.4;L.cy=900;L.r=800;
    }
    if(s.type==="onemore"){
      const om=e.querySelector(".om");om.style.opacity=cl((lt-.25)/.4)*(1-cl((lt-1.15)/.25));om.style.filter=`blur(${(1-out((lt-.25)/.6))*10}px)`;om.style.letterSpacing=`${lerp(.1,-.01,out(lt/1.3))}em`;
      const two=e.querySelector(".two");two.style.opacity=lt>1.35?1-x:0;
      const bu=e.querySelector(".burst"),rp=out((lt-1.3)/.9),d=40+1900*rp;bu.style.width=bu.style.height=d+"px";bu.style.opacity=(1-rp)*cl((lt-1.3)/.05);
      [...two.querySelectorAll(".ttl .ch")].forEach((c,j)=>{const p=back((lt-1.45-j*.07)/.55,1.3);c.style.transform=`scale(${lerp(2.4,1,p)})`;c.style.opacity=cl(p*1.5)});
      two.querySelector(".eye").style.opacity=out((lt-1.45)/.4);two.querySelector(".sub").style.opacity=out((lt-2.1)/.4);
      L.spot=.25+.75*cl((lt-1.35)/.3);L.glow=1.2*bell((lt-1.25)/.7)+.6*cl((lt-1.6)/.4);L.cy=s.image?620:820;L.r=820;L.flash=.7*bell((lt-1.28)/.25);
    }
    if(s.type==="end"){
      [...e.querySelectorAll(".row img")].forEach((im,i)=>{const p=out5((lt-.05-i*.09)/.8);im.style.transform=`translateY(${(1-p)*140}px) scale(${lerp(.7,1,p)})`;im.style.opacity=cl(p*1.4)});
      rise(e,".brand .ch",lt,.3,.04,.6);
      const pl=e.querySelector(".pill"),pp=back((lt-.75)/.6);pl.style.transform=`scale(${.5+.5*pp})`;pl.style.opacity=cl((lt-.75)/.2);
      e.querySelector(".sub").style.opacity=out((lt-1.1)/.4);
      L.spot=1;L.glow=.8*out(lt/.6);L.cy=700;L.r=900;
    }
  });
  stage(t,L);
};
